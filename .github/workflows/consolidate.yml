name: Consolidate Exercise Repositories

on:
  push:
    branches: [main]

concurrency:
  group: consolidate-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Clone and copy exercise repositories
        shell: bash
        run: |
          set -e

          repos=(
            "Production-ALB-Ingress"
            "Kubernetes-Node-NotReady-DiskPressure-"
            "Implement-IRSA-for-Application-Access"
            "Horizontal-Pod-Autoscaler-HPA-and-Cluster-Autoscaler-on-Amazon-EKS"
            "GitOps-Platform-Using-ArgoCD-on-Amazon-EKS"
            "Build-a-Production-EKS-Platform"
            "Production-Incident-Checkout-API-Latency-Investigation"
            "EKS-GitOps"
            "EKS-Node-Scale-Failure-Investigation"
            "DynamoDB-Application-Deployment-using-Amazon-EKS-IRSA"
            "External-Secrets-Failure-Investigation-AWS-EKS-"
          )

          mkdir -p /tmp/exercise-repos

          for repo in "${repos[@]}"; do
            echo "Cloning $repo..."
            git clone --depth 1 "https://github.com/SanjayNivasG/${repo}.git" "/tmp/exercise-repos/${repo}"
            rm -rf "/tmp/exercise-repos/${repo}/.git"

            mkdir -p "$repo"
            rsync -a --delete "/tmp/exercise-repos/${repo}/" "$repo/"
          done

      - name: Commit consolidated repositories
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Consolidate exercise repositories"

          # Retry if another commit reaches main while this job is running.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Push succeeded."
              exit 0
            fi

            echo "Push failed; synchronizing with origin/main (attempt $attempt)."
            git fetch origin main
            git rebase origin/main
          done

          echo "Unable to push after multiple attempts."
          exit 1
